name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt zipalign apksigner dalvik-exchange

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/test-java.sh

      - name: Restore signing key
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$APK_KEYSTORE_B64" | base64 -d > signing/q50.keystore
            echo "Using the persistent signing key from secrets."
          else
            echo "::warning::APK_KEYSTORE_B64 secret not set - signing with a throwaway key; this build cannot update an installed copy."
          fi

      - name: Build APK + EPK
        env:
          KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS || 'android' }}
        run: bash scripts/build-apk.sh

      - name: Render UI preview
        run: bash scripts/preview.sh

      - uses: actions/upload-artifact@v4
        with:
          name: q50-preview-${{ github.run_number }}
          path: build/preview/

      - uses: actions/upload-artifact@v4
        with:
          name: my-q50-${{ github.run_number }}
          path: |
            build/my-q50.epk
            build/my-q50.apk
            build/my-q50.sha256
